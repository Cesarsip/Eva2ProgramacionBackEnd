<!-- =====================================================================
     FORMULARIO DE INICIO DE SESIÓN JWT (LOGIN.HTML)
     Cumple Requerimiento 2 y 3: Tarjeta centrada con cabecera en azul oscuro
     (#0f172a), campos limpios para usuario/correo, contraseña con botón de ojo
     para alternar visibilidad, botón "Ingresar" en Verde Esmeralda (#10b981)
     y enlace de navegación al registro.
     ===================================================================== -->
{% extends 'academic/base.html' %}

{% block title %}Iniciar sesión &middot; EdTech Academy{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-md-7 col-lg-5 col-xl-4">
        <!-- Tarjeta de Login Estilizada -->
        <div class="card card-clean shadow-sm border-0">
            <!-- Cabecera Azul Marino Oscuro (#0f172a) -->
            <div class="card-header-navy">
                <i class="bi bi-box-arrow-in-right fs-5 text-success"></i>
                <span class="fw-bold">Iniciar sesión</span>
            </div>

            <!-- Cuerpo del Formulario -->
            <div class="p-4">
                <form id="form-login" onsubmit="event.preventDefault(); procesarLogin();">
                    <!-- Campo de Usuario o Correo -->
                    <div class="mb-3">
                        <label for="login-username" class="form-label">Usuario</label>
                        <input type="text" id="login-username" class="form-control" placeholder="Tu usuario o correo registrado..." required autofocus>
                        <div class="form-text small text-muted">Tu nombre de usuario o correo registrado.</div>
                    </div>

                    <!-- Campo de Contraseña con Botón de Ojo para Alternar Visibilidad -->
                    <div class="mb-4">
                        <label for="login-password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="login-password" class="form-control border-end-0" placeholder="••••••••" required>
                            <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" id="btn-toggle-pass" onclick="togglePasswordVisibility();" title="Mostrar/Ocultar contraseña">
                                <i class="bi bi-eye text-muted" id="icon-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Botón Principal Verde Esmeralda (#10b981) -->
                    <button type="submit" id="btn-submit-login" class="btn btn-emerald w-100 py-2 fs-6 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                    </button>
                </form>

                <!-- Enlace Inferior a Registro -->
                <div class="text-center mt-4 pt-3 border-top">
                    <span class="text-muted small">¿No tienes cuenta?</span>
                    <a href="{% url 'registro' %}" class="small fw-bold text-decoration-none text-success">Regístrate</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Alterna la visibilidad de la contraseña con el ícono de ojo
    function togglePasswordVisibility() {
        const passInput = document.getElementById('login-password');
        const eyeIcon = document.getElementById('icon-eye');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.className = 'bi bi-eye-slash text-dark';
        } else {
            passInput.type = 'password';
            eyeIcon.className = 'bi bi-eye text-muted';
        }
    }

    // Procesamiento asíncrono del inicio de sesión contra el endpoint /api/token/ (JWT)
    async function procesarLogin() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('btn-submit-login');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Validando credenciales...';

        try {
            const res = await fetch('/api/token/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Ingresar';

            if (res.ok) {
                API.setAuth(data.access, data.refresh, data.usuario);

                // Si el usuario es Estudiante, sincronizar ítems del carro anónimo a PostgreSQL
                if (data.usuario.rol === 'ESTUDIANTE') {
                    await sincronizarCarroAnonimo(data.access);
                }

                showToast(`¡Bienvenido/a, ${data.usuario.nombre_completo}!`, 'success');
                setTimeout(() => { window.location.href = '/'; }, 800);
            } else {
                showToast(data.detail || 'Usuario o contraseña incorrectos.', 'danger');
            }
        } catch (e) {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Ingresar';
            console.error(e);
            showToast('Error de comunicación con el servidor.', 'danger');
        }
    }
</script>
{% endblock %}
