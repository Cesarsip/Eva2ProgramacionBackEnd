          readOnly: true
        modalidad:
          allOf:
          - $ref: '#/components/schemas/ModalidadEnum'
          title: Modalidad del Programa
        modalidad_display:
          type: string
          readOnly: true
        costo_matricula:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Costo de Matrícula ($CLP)
