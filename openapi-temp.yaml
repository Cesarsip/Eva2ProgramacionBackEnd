- name: Cursos
  description: Catálogo, filtros y gestión de cursos y bootcamps.
- name: Carro de matrícula
  description: Carro persistente del estudiante autenticado.
- name: Matrículas
  description: Checkout, historial, consulta global y estados de matrícula.
