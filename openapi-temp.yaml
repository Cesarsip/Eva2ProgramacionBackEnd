    RolEnum:
      enum:
      - ESTUDIANTE
      - COORDINADOR
      type: string
      description: |-
        * `ESTUDIANTE` - Estudiante
        * `COORDINADOR` - Coordinador Académico
    Usuario:
      type: object
      description: |-
        Representa usuarios y permite crearlos con contraseña segura.

        ``password`` es opcional, solo de escritura y nunca se devuelve. Meta
        limita la representación a id, username, email, nombres, rol, RUT, teléfono
        y password; ``id`` es de solo lectura. Quitar este serializador elimina
        este contrato de registro/representación y su inicialización del carro.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Dirección de correo electrónico
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellidos
          maxLength: 150
        rol:
          allOf:
          - $ref: '#/components/schemas/RolEnum'
          title: Rol del Usuario
          description: |-
            Define los permisos y nivel de acceso en la plataforma EdTech

            * `ESTUDIANTE` - Estudiante
            * `COORDINADOR` - Coordinador Académico
        rut:
          type: string
          nullable: true
          title: RUT / Identificación
          maxLength: 20
        telefono:
          type: string
          nullable: true
          title: Teléfono de Contacto
          maxLength: 25
        password:
          type: string
          writeOnly: true
      required:
      - id
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
